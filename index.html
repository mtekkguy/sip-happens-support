<!DOCTYPE html>
<html lang="en">
<head>

  <title>Sip Happens – Support</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1C2A3A;
      color: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;

    .card {
      background: #243444;

      padding: 3rem 2.5rem;

      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);

    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #c8d8e4;
      margin-bottom: 2rem;
    }

    a.email-btn {
      display: inline-block;
      background: #65A9CC;
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.85rem 2rem;
      border-radius: 12px;
      transition: background 0.2s;
    }

    a.email-btn:hover { background: #4f94b8; }

    .footer {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: #5a7a8e;
